services:
  redis:
    image: redis:7-alpine
    container_name: confession_bot_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  bot:
    build: .
    container_name: confession_bot_app
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - .:/app
      - bot_data:/app/data

volumes:
  redis_data:
  bot_data:

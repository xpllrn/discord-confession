services:
  confess-redis:
    image: redis:7-alpine
    container_name: confess-redis
    restart: always
    ports:
      - "6380:6380"
    volumes:
      - redis_data:/data
    command: redis-server --port 6380
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  confess:
    build: .
    container_name: confess
    restart: always
    depends_on:
      confess-redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${STATUS_API_PORT:-8082}:${STATUS_API_PORT:-8082}"
    volumes:
      - .:/app
      - bot_data:/app/data

volumes:
  redis_data:
  bot_data: